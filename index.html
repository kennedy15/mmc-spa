<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>MapleTracker</title>
    <!-- Apply the saved color theme before first paint (src/app/theme.ts owns it after load). -->
    <script>try { if (localStorage.getItem('mt.theme') === 'aurora') document.documentElement.dataset.theme = 'aurora'; } catch (e) {}</script>
    <!-- Inter from its official CDN: the Google Fonts build strips the character
         variants, including cv08 (serifed capital I) that tells PikaIus from Pikalus. -->
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
