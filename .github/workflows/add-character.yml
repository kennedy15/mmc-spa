name: Add character

on:
  workflow_dispatch:
    inputs:
      name:
        description: Character name (IGN), exactly as in game
        required: true
      role:
        description: main, mule, legion, friend-main…
        default: mule
      owner:
        description: me or friend
        default: me
      world:
        description: World name or id; blank = the world in characters.json
        default: ''

concurrency:
  group: snapshot
  cancel-in-progress: false
  # A second run waits its turn instead of replacing the one already waiting.
  queue: max

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Look up and add
        # Inputs go through env vars rather than ${{ }} in the script, so a quote
        # or $ in a typed name can't change the shell command.
        env:
          NAME: ${{ inputs.name }}
          ROLE: ${{ inputs.role }}
          OWNER: ${{ inputs.owner }}
          WORLD: ${{ inputs.world }}
        run: node scripts/add-character.mjs "$NAME" --role "$ROLE" --owner "$OWNER" --world "$WORLD"
      - name: Snapshot the updated roster
        run: node scripts/snapshot.mjs
        env:
          RETRY_DELAY_MS: '120000'
      - name: Commit
        id: commit
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "maple-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "add character: $NAME"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: add
    if: needs.add.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
