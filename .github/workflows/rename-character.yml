name: Rename character

on:
  workflow_dispatch:
    inputs:
      from:
        description: Current name, as tracked
        required: true
      to:
        description: New name, exactly as in game
        required: true
      force:
        description: Skip the same-character checks (job, level, old name gone from the rankings)
        type: boolean
        default: false

concurrency:
  group: snapshot
  cancel-in-progress: false
  # A second run waits its turn instead of replacing the one already waiting.
  queue: max

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch as it is when the run starts: a snapshot run queued
          # ahead of this one may have pushed since it was dispatched.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check and rename
        # Inputs go through env vars rather than ${{ }} in the script, so a quote
        # or $ in a typed name can't change the shell command.
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then set -- --force; fi
          node scripts/rename-character.mjs "$FROM" "$TO" "$@"
      - name: Snapshot under the new name
        run: node scripts/snapshot.mjs
        env:
          RETRY_DELAY_MS: '120000'
      - name: Commit
        id: commit
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          git config user.name "maple-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "rename character: $FROM -> $TO"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: rename
    if: needs.rename.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
